<!DOCTYPE html>

  <head>

  <body>

      <h1 class="rainbow-title">Dress Up</h1>

        </div>
        <canvas id="gameCanvas" width="464" height="930"></canvas>
        <!-- <img src="./images/top.png" />
        <img src="./images/middle.png" />
        <img src="./images/bottom.png" /> -->
        <div id="right" class="leftRight">
          <button id="topRight" class="goRight"></button>
          <button id="midRight" class="goRight"></button>
          <button id="bottomRight" class="goRight"></button>
        </div>
      </div>
    </div>
    <script type="module" src="./index.js"></script>
